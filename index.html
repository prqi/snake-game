<!-- v6 修改版 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>360° 摇杆贪吃蛇 v5</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
        html,body { width:100%; height:100%; overflow:hidden; background:#1a1a2e; touch-action:manipulation; }
        body { display:flex; justify-content:center; align-items:center; font-family:'Segoe UI',system-ui,sans-serif; }
        .game-wrapper { width:100%; max-width:520px; height:100vh; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px; }

        /* Header */
        .header { display:flex; justify-content:space-between; align-items:center; width:100%; padding:0 4px; flex-shrink:0; }
        .score-panel { background:rgba(255,255,255,0.08); border-radius:12px; padding:8px 18px; color:#e0e0e0; font-weight:600; backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.12); display:flex; gap:20px; }
        .score-panel .label { font-size:10px; letter-spacing:1.2px; color:#888; }
        .score-panel .value { font-size:19px; font-weight:700; color:#fff; }
        .score-item { text-align:center; }
        .header-right { display:flex; gap:8px; align-items:center; }
        .player-name-tag { background:rgba(255,255,255,0.1); border-radius:8px; padding:5px 10px; font-size:11px; font-weight:600; color:#fff; border:1px solid rgba(255,255,255,0.2); max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .rename-link { color:#ff5252; font-size:10px; cursor:pointer; text-decoration:underline; flex-shrink:0; }
        .difficulty-badge { background:rgba(255,255,255,0.1); border-radius:8px; padding:5px 12px; font-size:12px; font-weight:700; letter-spacing:0.5px; }
        .difficulty-badge.easy { color:#66bb6a; border:1px solid rgba(76,175,80,0.5); }
        .difficulty-badge.normal { color:#ffa726; border:1px solid rgba(255,167,38,0.5); }
        .difficulty-badge.hard { color:#ef5350; border:1px solid rgba(239,83,80,0.5); }
        .difficulty-badge.custom { color:#64b5f6; border:1px solid rgba(100,181,246,0.5); }
        .btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 16px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.15s; backdrop-filter:blur(8px); }
        .btn:active { background:rgba(255,255,255,0.25); transform:scale(0.95); }
        .btn-primary { background:rgba(76,175,80,0.3); border-color:rgba(76,175,80,0.5); }
        .btn-accent { background:rgba(100,181,246,0.3); border-color:rgba(100,181,246,0.5); }

        /* Canvas */
        .canvas-container { position:relative; flex-shrink:0; border-radius:16px; box-shadow:0 0 60px rgba(80,80,255,0.15),0 0 0 2px rgba(255,255,255,0.08); }
        canvas { display:block; border-radius:16px; background:#0f0f23; width:100%; height:auto; }

        /* Overlays */
        .full-overlay { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,5,20,0.85); border-radius:16px; z-index:10; transition:opacity 0.3s; opacity:1; pointer-events:all; }
        .full-overlay.hidden { opacity:0; pointer-events:none; }

        /* Initial Diff Select */
        .diff-select { gap:10px; }
        .diff-select h2 { color:#fff; font-size:clamp(22px,5vw,28px); font-weight:700; }
        .diff-select .subtitle { color:rgba(255,255,255,0.45); font-size:13px; margin-bottom:6px; }
        .diff-options { display:flex; flex-direction:column; gap:10px; width:min(280px,75vw); }
        .diff-card { background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.12); border-radius:14px; padding:14px 18px; color:#fff; cursor:pointer; display:flex; align-items:center; gap:14px; transition:all 0.2s; }
        .diff-card:active { transform:scale(0.97); }
        .diff-card.easy:active { border-color:#4caf50; background:rgba(76,175,80,0.12); }
        .diff-card.normal:active { border-color:#ffa726; background:rgba(255,167,38,0.12); }
        .diff-card.hard:active { border-color:#ef5350; background:rgba(239,83,80,0.12); }
        .diff-icon { font-size:32px; flex-shrink:0; width:44px; text-align:center; }
        .diff-info { display:flex; flex-direction:column; gap:3px; }
        .diff-name { font-size:18px; font-weight:700; }
        .diff-card.easy .diff-name { color:#66bb6a; }
        .diff-card.normal .diff-name { color:#ffa726; }
        .diff-card.hard .diff-name { color:#ef5350; }
        .diff-desc { font-size:12px; color:rgba(255,255,255,0.5); line-height:1.4; }

        /* Name Input */
        .name-overlay { gap:16px; z-index:20; }
        .name-overlay h2 { color:#fff; font-size:clamp(20px,5vw,26px); }
        .name-overlay .name-subtitle { color:rgba(255,255,255,0.5); font-size:13px; }
        .name-overlay input { background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); border-radius:12px; padding:12px 16px; color:#fff; font-size:18px; font-weight:600; text-align:center; width:min(220px,60vw); outline:none; transition:border-color 0.2s; }
        .name-overlay input:focus { border-color:rgba(76,175,80,0.6); }
        .name-overlay input::placeholder { color:rgba(255,255,255,0.3); }
        .name-overlay .name-btns { display:flex; gap:10px; }
        .name-overlay .btn-ghost { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.15); color:rgba(255,255,255,0.6); }

        /* ─── Game Over (4-tab layout) ─────────── */
        .gameover-overlay { flex-direction:column; gap:0; padding:8px; align-items:stretch; justify-content:flex-start; }
        .go-header { text-align:center; padding:4px 0 8px; flex-shrink:0; }
        .go-header h2 { color:#ff6b6b; font-size:clamp(18px,5vw,24px); text-shadow:0 0 20px rgba(255,107,107,0.5); }
        .go-header .final-score { color:#fff; font-size:16px; font-weight:600; }
        .go-header .final-diff { color:rgba(255,255,255,0.4); font-size:11px; }

        /* Tab bar */
        .go-tabs { display:flex; gap:0; margin-bottom:8px; border-radius:10px; overflow:hidden; flex-shrink:0; }
        .go-tab { flex:1; padding:8px 0; text-align:center; font-size:11px; font-weight:700; background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.35); cursor:pointer; transition:all 0.2s; border:none; }
        .go-tab.active { background:rgba(255,255,255,0.12); color:#fff; }

        /* Tab panels */
        .go-panels { flex:1; overflow:hidden; min-height:0; position:relative; }
        .go-panel { position:absolute; top:0;left:0;right:0;bottom:0; overflow-y:auto; display:none; flex-direction:column; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.1) transparent; }
        .go-panel.active { display:flex; }

        /* Panel: Settings */
        .setting-group { margin-bottom:14px; }
        .setting-label { color:rgba(255,255,255,0.7); font-size:12px; font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between; }
        .setting-val { color:rgba(255,255,255,0.4); font-weight:400; }

        /* Color picker */
        .color-options { display:flex; gap:8px; flex-wrap:wrap; }
        .color-dot { width:36px; height:36px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:all 0.15s; }
        .color-dot:active { transform:scale(0.9); }
        .color-dot.selected { border-color:#fff; box-shadow:0 0 12px currentColor; }
        .color-dot.green { background:#4caf50; color:#4caf50; }
        .color-dot.blue { background:#42a5f5; color:#42a5f5; }
        .color-dot.purple { background:#ab47bc; color:#ab47bc; }
        .color-dot.orange { background:#ff7043; color:#ff7043; }
        .color-dot.pink { background:#ec407a; color:#ec407a; }
        .color-dot.yellow { background:#fdd835; color:#fdd835; }
        .color-dot.cyan { background:#26c6da; color:#26c6da; }
        .color-dot.white { background:#e0e0e0; color:#e0e0e0; }
        .color-dot.rainbow { background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red); color:#fff; border-color:rgba(255,255,255,0.3); }
        .color-dot.rainbow.selected { border-color:#fff; box-shadow:0 0 14px rgba(255,255,255,0.7); }

        /* Sliders */
        .slider-container { position:relative; height:40px; display:flex; align-items:center; }
        .slider-track { position:absolute; left:0;right:0;height:6px; background:rgba(255,255,255,0.1); border-radius:3px; }
        .slider-fill { position:absolute; left:0;height:6px; background:rgba(100,181,246,0.5); border-radius:3px; transition:width 0.05s; }
        .slider-input { position:absolute; left:0;right:0; width:100%; height:40px; opacity:0; cursor:pointer; margin:0; -webkit-appearance:none; }
        .slider-input::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:#fff; border:2px solid rgba(100,181,246,0.8); box-shadow:0 2px 8px rgba(0,0,0,0.3); cursor:pointer; pointer-events:all; }
        .slider-ticks { display:flex; justify-content:space-between; font-size:9px; color:rgba(255,255,255,0.3); padding:0 2px; margin-top:-4px; }

        /* Panel: Leaderboard */
        .lb-tabs { display:flex; gap:0; margin-bottom:6px; border-radius:8px; overflow:hidden; flex-shrink:0; }
        .lb-tab { flex:1; padding:5px 0; text-align:center; font-size:10px; font-weight:700; background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.35); cursor:pointer; transition:all 0.2s; border:none; }
        .lb-tab.active.easy { background:rgba(76,175,80,0.2); color:#66bb6a; }
        .lb-tab.active.normal { background:rgba(255,167,38,0.2); color:#ffa726; }
        .lb-tab.active.hard { background:rgba(239,83,80,0.2); color:#ef5350; }
        .lb-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:3px; min-height:0; padding-right:4px; }
        .lb-item { display:flex; align-items:center; padding:4px 8px; border-radius:6px; background:rgba(255,255,255,0.04); font-size:11px; flex-shrink:0; gap:4px; }
        .lb-rank { width:18px; font-weight:700; font-size:11px; color:rgba(255,255,255,0.35); flex-shrink:0; }
        .lb-rank.top1 { color:#ffd700; } .lb-rank.top2 { color:#c0c0c0; } .lb-rank.top3 { color:#cd7f32; }
        .lb-name { flex:1; color:#fff; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .lb-score { font-weight:700; color:#fff; margin-left:auto; flex-shrink:0; }
        .lb-empty { text-align:center; color:rgba(255,255,255,0.2); font-size:11px; padding:12px 0; }
        .lb-loading { text-align:center; color:rgba(255,255,255,0.3); font-size:11px; padding:12px 0; }

        /* Panel: Ranked */
        .ranked-diff-options { display:flex; flex-direction:column; gap:8px; }
        .ranked-diff-btn { background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.12); border-radius:12px; padding:12px 16px; color:#fff; cursor:pointer; display:flex; align-items:center; gap:12px; transition:all 0.15s; }
        .ranked-diff-btn:active { transform:scale(0.97); }
        .ranked-diff-btn.easy:active { border-color:#4caf50; background:rgba(76,175,80,0.12); }
        .ranked-diff-btn.normal:active { border-color:#ffa726; background:rgba(255,167,38,0.12); }
        .ranked-diff-btn.hard:active { border-color:#ef5350; background:rgba(239,83,80,0.12); }
        .ranked-diff-btn .rd-icon { font-size:28px; flex-shrink:0; }
        .ranked-diff-btn .rd-info { display:flex; flex-direction:column; gap:2px; }
        .ranked-diff-btn .rd-name { font-size:15px; font-weight:700; }
        .ranked-diff-btn.easy .rd-name { color:#66bb6a; }
        .ranked-diff-btn.normal .rd-name { color:#ffa726; }
        .ranked-diff-btn.hard .rd-name { color:#ef5350; }
        .ranked-diff-btn .rd-desc { font-size:11px; color:rgba(255,255,255,0.45); }

        /* Panel: Custom */
        .custom-start-btn { margin-top:14px; width:100%; }

        /* Tail collision toggle */
        .toggle-group { display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); border-radius:10px; padding:10px 14px; margin-bottom:10px; }
        .toggle-label { color:rgba(255,255,255,0.7); font-size:12px; font-weight:600; }
        .toggle-switch { position:relative; width:48px; height:28px; flex-shrink:0; cursor:pointer; }
        .toggle-switch .track { position:absolute; top:0;left:0;right:0;bottom:0; background:rgba(255,255,255,0.15); border-radius:14px; transition:background 0.2s; }
        .toggle-switch.on .track { background:rgba(76,175,80,0.5); }
        .toggle-switch .knob { position:absolute; top:3px;left:3px; width:22px;height:22px; border-radius:50%; background:#fff; transition:transform 0.2s; box-shadow:0 1px 4px rgba(0,0,0,0.3); }
        .toggle-switch.on .knob { transform:translateX(20px); }

        /* Revive overlay */
        .revive-overlay { gap:14px; z-index:20; }
        .revive-overlay h2 { color:#ffd740; font-size:clamp(18px,5vw,22px); text-shadow:0 0 16px rgba(255,215,64,0.4); }
        .revive-overlay .revive-subtitle { color:rgba(255,255,255,0.5); font-size:12px; text-align:center; line-height:1.5; }
        .revive-overlay .revive-btns { display:flex; gap:10px; }
        .revive-overlay .btn-revive { background:rgba(255,215,64,0.25); border-color:rgba(255,215,64,0.5); color:#ffd740; }
        .revive-overlay .btn-reject { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.15); color:rgba(255,255,255,0.5); }

        /* Fail screen */
        .fail-overlay { display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:19; cursor:pointer; }
        .fail-overlay.hidden { display:none; }
        .fail-text { font-size:clamp(48px,12vw,72px); font-weight:900; color:#ff1744; text-shadow:0 0 40px rgba(255,23,68,0.5),0 4px 20px rgba(0,0,0,0.5); letter-spacing:12px; animation:failPulse 1.5s ease-in-out infinite; }
        @keyframes failPulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.05);opacity:0.9;} }
        .fail-hint { margin-top:18px; font-size:13px; color:rgba(255,255,255,0.4); letter-spacing:2px; }

        /* Joystick */
        .joystick-zone { position:relative; width:140px; height:140px; flex-shrink:0; }
        .joystick-base { position:absolute; width:124px; height:124px; top:8px; left:8px; border-radius:50%; background:rgba(255,255,255,0.05); border:3px solid rgba(255,255,255,0.18); box-shadow:inset 0 0 30px rgba(0,0,0,0.3); }
        .joystick-thumb { position:absolute; width:56px; height:56px; top:42px; left:42px; border-radius:50%; background:radial-gradient(circle at 40% 40%,rgba(120,180,255,0.75),rgba(40,80,200,0.9)); box-shadow:0 4px 20px rgba(60,120,255,0.5); transition:box-shadow 0.15s; }
        .hint { color:rgba(255,255,255,0.35); font-size:11px; flex-shrink:0; }

        /* Boost skill button */
        .boost-btn { width:56px; height:56px; border-radius:50%; background:rgba(100,181,246,0.3); border:2px solid rgba(100,181,246,0.6); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:background 0.3s,border-color 0.3s,opacity 0.3s; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .boost-btn:active { background:rgba(100,181,246,0.6); }
        .boost-btn.on-cooldown { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.15); cursor:not-allowed; }
        .boost-btn.on-cooldown svg { opacity:0.35; }
        .boost-btn.hidden { display:none; }
        @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

        /* ─── Versus (对战) ─────────────────────── */
        .versus-menu { display:flex; flex-direction:column; gap:16px; align-items:center; width:100%; }
        .versus-btn { width:100%; padding:12px 16px; font-size:14px; }
        .versus-divider { display:flex; align-items:center; gap:10px; width:100%; color:rgba(255,255,255,0.3); font-size:11px; }
        .versus-divider::before, .versus-divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.1); }
        .versus-input { width:100%; padding:10px 14px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:10px; color:#fff; font-size:16px; text-align:center; letter-spacing:4px; text-transform:uppercase; }
        .versus-input:focus { outline:none; border-color:rgba(100,180,255,0.5); }
        .versus-section { width:100%; display:flex; flex-direction:column; gap:8px; }

        /* Versus room overlay */
        .versus-room-overlay { gap:14px; z-index:15; }
        .room-code-display { font-size:24px; font-weight:800; letter-spacing:6px; color:#4fc3f7; background:rgba(79,195,247,0.1); padding:8px 20px; border-radius:10px; border:1px solid rgba(79,195,247,0.3); }
        .versus-player-list { width:100%; max-height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
        .versus-player-item { display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.06); border-radius:10px; padding:10px 14px; }
        .versus-player-item .vp-left { display:flex; align-items:center; gap:8px; }
        .versus-player-item .vp-color { width:16px; height:16px; border-radius:50%; flex-shrink:0; }
        .versus-player-item .vp-name { color:#fff; font-size:13px; font-weight:600; }
        .versus-player-item .vp-host { font-size:9px; background:rgba(255,215,64,0.2); color:#ffd740; padding:2px 6px; border-radius:4px; }
        .versus-player-item .vp-ready { font-size:11px; color:#66bb6a; font-weight:600; }
        .versus-player-item .vp-not-ready { font-size:11px; color:rgba(255,255,255,0.3); }
        .versus-room-actions { display:flex; gap:8px; width:100%; }
        .versus-room-actions .btn { flex:1; }
        .btn-ready.active { background:rgba(76,175,80,0.3); border-color:rgba(76,175,80,0.6); color:#66bb6a; }

        /* Versus dead overlay */
        .versus-dead-overlay { gap:14px; z-index:18; }
        .versus-dead-overlay h2 { color:#ff5252; font-size:clamp(20px,5vw,24px); }
        .dead-ranking { color:rgba(255,255,255,0.5); font-size:14px; }
        .versus-dead-btns { display:flex; gap:10px; }

        /* Versus game over overlay */
        .versus-gameover-overlay { gap:12px; z-index:18; }
        .versus-history-overlay, .versus-detail-overlay, .versus-replay-overlay { gap:10px; z-index:18; }
        .versus-history-list { display:flex; flex-direction:column; gap:6px; }
        .history-item { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.06); border-radius:10px; padding:10px 14px; cursor:pointer; }
        .history-item:active { background:rgba(255,255,255,0.1); }
        .history-item .hi-left { display:flex; flex-direction:column; gap:2px; }
        .history-item .hi-rank { font-size:14px; font-weight:700; color:#ffd740; }
        .history-item .hi-time { font-size:10px; color:rgba(255,255,255,0.4); }
        .history-item .hi-duration { font-size:11px; color:rgba(255,255,255,0.5); }
        .history-detail-section { background:rgba(255,255,255,0.05); border-radius:10px; padding:12px; margin-bottom:8px; }
        .history-detail-section h3 { color:#fff; font-size:13px; margin-bottom:8px; }
        .history-player-row { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; font-size:12px; color:rgba(255,255,255,0.7); }
        .history-player-row .hp-color { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
        .detail-btn { width:100%; padding:10px; margin-top:6px; font-size:12px; }
        .btn-danger { background:rgba(244,67,54,0.2); border-color:rgba(244,67,54,0.4); color:#ef5350; }
        .versus-winner { font-size:18px; color:#ffd740; font-weight:700; }
        .versus-ranking-list { width:100%; max-height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
        .versus-rank-item { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); border-radius:8px; padding:8px 12px; font-size:12px; }
        .versus-rank-item.me { background:rgba(76,175,80,0.12); }
        .spectator-badge { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(255,152,0,0.2); color:#ffb74d; padding:4px 14px; border-radius:8px; font-size:11px; font-weight:600; z-index:5; border:1px solid rgba(255,152,0,0.3); }

        /* Kill notification */
        .net-status { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(10,20,40,0.92); color:#4fc3f7; padding:6px 14px; border-radius:8px; font-size:11px; font-weight:600; z-index:30; border:1px solid rgba(79,195,247,0.4); white-space:nowrap; backdrop-filter:blur(8px); max-width:90%; overflow:hidden; text-overflow:ellipsis; }
        .room-list-box { width:100%; max-height:132px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
