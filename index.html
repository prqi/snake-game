<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    touch-action: none;
  }
  h1 { margin: 8px; font-size: 22px; }
  #score { margin: 4px; font-size: 16px; }
  canvas {
    background: #000;
    border: 2px solid #0f0;
    max-width: 95vw;
    max-height: 70vh;
  }
  .btns {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    justify-items: center;
    align-items: center;
  }
  button {
    width: 52px; height: 52px;
    font-size: 22px;
    border-radius: 10px;
    border: none;
    background: #222;
    color: #0f0;
  }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #down { grid-column: 2; grid-row: 3; }
  #restart {
    margin-top: 10px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: #0f0;
    color: #000;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div id="score">分数: 0</div>
<canvas id="game" width="360" height="360"></canvas>

<div class="btns">
  <button id="up">↑</button>
  <button id="left">←</button>
  <button id="right">→</button>
  <button id="down">↓</button>
</div>

<button id="restart">重新开始</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

const size = 20;
let snake, dir, food, score, timer;

function init() {
  snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
  dir = {x:1,y:0};
  score = 0;
  scoreEl.textContent = "分数: 0";
  placeFood();
  if (timer) clearInterval(timer);
  timer = setInterval(loop, 120);
}

function placeFood() {
  food = {
    x: Math.floor(Math.random()*18),
    y: Math.floor(Math.random()*18)
  };
}

function loop() {
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x<0||head.y<0||head.x>=18||head.y>=18) return gameOver();
  if (snake.some(s=>s.x===head.x&&s.y===head.y)) return gameOver();

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y) {
    score++;
    scoreEl.textContent = "分数: " + score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "red";
  ctx.fillRect(food.x*size, food.y*size, size-2, size-2);

  ctx.fillStyle = "lime";
  snake.forEach((s,i)=>{
    ctx.fillRect(s.x*size, s.y*size, size-2, size-2);
  });
}

function gameOver() {
  clearInterval(timer);
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "white";
  ctx.font = "28px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("游戏结束", canvas.width/2, canvas.height/2);
}

document.getElementById("up").onclick = ()=>{ if(dir.y!==1) dir={x:0,y:-1}; };
document.getElementById("left").onclick = ()=>{ if(dir.x!==1) dir={x:-1,y:0}; };
document.getElementById("right").onclick = ()=>{ if(dir.x!==-1) dir={x:1,y:0}; };
document.getElementById("down").onclick = ()=>{ if(dir.y!==-1) dir={x:0,y:1}; };
document.getElementById("restart").onclick = init;

let tx=0,ty=0;
canvas.addEventListener("touchstart", e=>{
  tx=e.touches[0].clientX; ty=e.touches[0].clientY;
});
canvas.addEventListener("touchend", e=>{
  const x=e.changedTouches[0].clientX-tx;
  const y=e.changedTouches[0].clientY-ty;
  if(Math.abs(x)>Math.abs(y)){
    if(x>0 && dir.x!==-1) dir={x:1,y:0};
    else if(x<0 && dir.x!==1) dir={x:-1,y:0};
  }else{
    if(y>0 && dir.y!==-1) dir={x:0,y:1};
    else if(y<0 && dir.y!==1) dir={x:0,y:-1};
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowUp" && dir.y!==1) dir={x:0,y:-1};
  if(e.key==="ArrowDown" && dir.y!==-1) dir={x:0,y:1};
  if(e.key==="ArrowLeft" && dir.x!==1) dir={x:-1,y:0};
  if(e.key==="ArrowRight" && dir.x!==-1) dir={x:1,y:0};
});

init();
</script>
</body>
</html>
